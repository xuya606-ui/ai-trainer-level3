name: Apply SJTU verified homepage update
on:
  push:
    paths:
      - '.github/workflows/apply-sjtu-verified-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('只保留三级｜上海交大官方入口逐项核验｜国家职业技能标准辅助学习｜编码内容明确区分“官方”与“训练建议”','只保留三级｜已实际解析上海交大官方ZIP｜按官方考试结构、Python编码实操、题型与评分点备考')
          old='<div class="warning"><b>重要：</b>交大官网的三级评价方案与三级指导手册为 ZIP 附件。当前在线解析工具可以核验其官方链接和文件版本，但无法直接展开 ZIP 内部文件。为避免给你错误信息，本站<strong>不会把未读取到的 ZIP 内部细节冒充为上海交大官方考试要求</strong>。所有“编码练习/实操练习”均明确标记为本站训练建议，除非能被官方原文直接核实。</div>'
          new='<div class="verified"><b>ZIP已完成解析：</b>本站已实际下载并解压上海交大官方三级竞赛评价方案 <code>RG3_J1.1_20250916.zip</code> 与三级指导手册 <code>4-04-05-05_3_20250701.zip</code>，并核对内部认定方案、要素细目表、理论复习题、操作技能复习题及模拟卷。已确认：理论闭卷机考90分钟、190题；实操120分钟、100分、6题；官方环境明确包含Python，实操复习题大量使用.ipynb代码框架。</div><p><a class="btn green" href="sjtu-official-level3.html">查看上海交大三级官方资料完整核验页</a></p>'
          s=s.replace(old,new)
          old2='<div class="warning"><b>准确性说明：</b>截至本站本次核验，上海交大官网公开页面能确认“三级指导手册/评价方案/素材/虚拟机”存在，但无法从网页正文直接确认“考试必须使用 Python / Pandas / scikit-learn”。因此下面代码是为了训练数据处理、算法测试、指标分析能力，<strong>不能标记为交大官方指定语言或指定库</strong>。</div>'
          new2='<div class="verified"><b>官方编码要求已核验：</b>三级官方竞赛/认定资料明确列出开发工具及实训套件包含 <strong>Python</strong>；操作技能复习题明确要求Python编译环境并提供 <code>.ipynb</code> 代码框架。官方理论复习题直接涉及 Pandas、NumPy、Matplotlib、Scikit-learn、TensorFlow/PyTorch 等。本站代码训练将按这些官方覆盖点组织，但具体软件版本仍以考试现场环境为准。</div>'
          s=s.replace(old2,new2)
          marker='<a href="#coding">编码训练</a>'
          if 'sjtu-official-level3.html' not in s.split('</nav>')[0]:
              s=s.replace(marker,marker+'<a href="sjtu-official-level3.html">交大官方核验</a>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-sjtu-verified-update.yml
          git add index.html .github/workflows/apply-sjtu-verified-update.yml
          git commit -m 'Update homepage with verified SJTU level 3 findings'
          git push
