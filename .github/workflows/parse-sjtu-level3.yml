name: Parse SJTU Level3 Official Archives

on:
  push:
    paths:
      - '.github/workflows/parse-sjtu-level3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip poppler-utils libreoffice python3-pip
          pip install python-docx openpyxl pandas lxml
      - name: Download official SJTU archives
        run: |
          mkdir -p work/a work/b official-materials
          curl -L --fail --retry 3 -o work/RG3_J1.1_20250916.zip https://gjzs.sjtu.edu.cn/uploads/addons/skill/RG3_J1.1_20250916.zip
          curl -L --fail --retry 3 -o work/4-04-05-05_3_20250701.zip https://gjzs.sjtu.edu.cn/uploads/addons/skill/4-04-05-05_3_20250701.zip
          unzip -o work/RG3_J1.1_20250916.zip -d work/a
          unzip -o work/4-04-05-05_3_20250701.zip -d work/b
      - name: Parse archives
        run: |
          python - <<'PY'
          import os, subprocess, zipfile, json, re
          from pathlib import Path
          from docx import Document
          from openpyxl import load_workbook

          roots=[Path('work/a'),Path('work/b')]
          out=Path('official-materials/sjtu-level3-parsed.txt')
          manifest=Path('official-materials/sjtu-level3-manifest.txt')
          lines=[]; man=[]
          def add(title, text):
              lines.append('\n'+'='*90+'\n'+title+'\n'+'='*90+'\n'+text.strip()+'\n')
          for root in roots:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  rel=str(p)
                  man.append(f'{rel}\t{p.stat().st_size} bytes')
                  suf=p.suffix.lower()
                  try:
                      if suf=='.pdf':
                          txt=subprocess.check_output(['pdftotext','-layout',str(p),'-'],stderr=subprocess.STDOUT).decode('utf-8','ignore')
                          add(rel,txt)
                      elif suf=='.docx':
                          d=Document(str(p)); txt='\n'.join(x.text for x in d.paragraphs)
                          for t in d.tables:
                              for row in t.rows: txt+='\n'+'\t'.join(c.text for c in row.cells)
                          add(rel,txt)
                      elif suf in ['.doc','.ppt','.pptx','.xls']:
                          conv=Path('work/converted'); conv.mkdir(exist_ok=True)
                          subprocess.run(['libreoffice','--headless','--convert-to','pdf','--outdir',str(conv),str(p)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                          pdf=conv/(p.stem+'.pdf')
                          if pdf.exists():
                              txt=subprocess.check_output(['pdftotext','-layout',str(pdf),'-']).decode('utf-8','ignore'); add(rel,txt)
                      elif suf=='.xlsx':
                          wb=load_workbook(str(p),data_only=True,read_only=True)
                          txt=[]
                          for ws in wb.worksheets:
                              txt.append(f'### SHEET {ws.title}')
                              for row in ws.iter_rows(values_only=True):
                                  vals=['' if v is None else str(v) for v in row]
                                  if any(vals): txt.append('\t'.join(vals))
                          add(rel,'\n'.join(txt))
                      elif suf in ['.txt','.md','.csv','.py','.json','.xml','.html','.htm','.ini','.cfg']:
                          add(rel,p.read_text(encoding='utf-8',errors='ignore'))
                      else:
                          # record non-text files in manifest only
                          pass
                  except Exception as e:
                      add(rel,f'[PARSE ERROR] {e}')
          out.write_text(''.join(lines),encoding='utf-8')
          manifest.write_text('\n'.join(man),encoding='utf-8')
          print('parsed chars', out.stat().st_size)
          print('files', len(man))
          PY
      - name: Commit parsed output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-materials/sjtu-level3-parsed.txt official-materials/sjtu-level3-manifest.txt
          git commit -m 'Parse SJTU level 3 official archives' || exit 0
          git push
