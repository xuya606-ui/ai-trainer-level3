<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工智能训练师三级｜官方理论模拟工具</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:960px;margin:auto;padding:18px}.hero{background:#172554;color:#fff;padding:30px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.timer{font-size:32px;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 14px;background:#315efb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}.green{background:#0f9f78}.ok{background:#f3fcf8;border-left:4px solid #0f9f78;padding:12px;border-radius:8px}.warn{background:#fff7ed;border-left:4px solid #d97706;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}</style></head><body><div class="hero"><div class="wrap"><h1>上海人工智能训练师三级｜官方理论模拟工具</h1><p>仅配合上海交大官方理论模拟试卷使用，不再生成原创题。</p></div></div><main class="wrap"><section class="card"><div class="ok"><b>已调整：</b>此前页面中的原创模拟题已全部移除。本页只保留官方考试结构、90分钟计时器、成绩记录和官方模拟卷索引。</div></section><section class="card"><h2>官方考试结构</h2><table><tr><th>题型</th><th>题量</th><th>分值</th></tr><tr><td>判断题</td><td>40</td><td>20</td></tr><tr><td>单选题</td><td>140</td><td>70</td></tr><tr><td>多选题</td><td>10</td><td>10</td></tr><tr><td>总计</td><td>190</td><td>100</td></tr></table><p>考试时间：90分钟。</p></section><section class="card"><h2>官方模拟卷</h2><p>来源：第5部分《人工智能训练师_3级_理论知识模拟试卷》。</p><a class="btn green" href="official-html/10-theory-mock.html">查看官方模拟卷索引</a><a class="btn" href="official-practice-level3.html">进入官方题库入口</a><div class="warn">完整官方模拟题通过上海交大官方指导手册获取，本站不再展示任何原创模拟题。</div></section><section class="card"><h2>90分钟计时器</h2><div class="timer" id="timer">90:00</div><button class="btn green" onclick="startT()">开始</button><button class="btn" onclick="resetT()">重置</button></section><section class="card"><h2>成绩记录</h2><p><input id="score" type="number" min="0" max="100" placeholder="成绩" style="padding:9px;width:120px"> / 100</p><textarea id="note" style="width:100%;min-height:140px;padding:10px" placeholder="记录错题模块和需要复习的官方章节"></textarea><p><button class="btn" onclick="saveR()">保存</button></p></section><p><a href="index.html">← 返回主页</a></p></main><script>let sec=5400,it=null;function draw(){let m=Math.floor(sec/60),s=sec%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function startT(){if(it)return;it=setInterval(()=>{sec--;draw();if(sec<=0){clearInterval(it);it=null}},1000)}function resetT(){clearInterval(it);it=null;sec=5400;draw()}function saveR(){localStorage.setItem('official_mock_score',document.getElementById('score').value);localStorage.setItem('official_mock_note',document.getElementById('note').value)}document.getElementById('score').value=localStorage.getItem('official_mock_score')||'';document.getElementById('note').value=localStorage.getItem('official_mock_note')||'';</script></body></html>
