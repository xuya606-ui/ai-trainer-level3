<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三级120分钟实操模拟</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#0f766e,#0f9f78);color:#fff;padding:32px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.task{border-left:4px solid #0f9f78;background:#f4fbf8;padding:14px;margin:12px 0;border-radius:8px}.btn{background:#315efb;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.timer{font-size:28px;font-weight:800}.check{display:flex;gap:8px;margin:8px 0}.muted{color:#667085}textarea{width:100%;min-height:120px;border:1px solid #d0d5dd;border-radius:10px;padding:10px}code{background:#eef2ff;padding:2px 5px;border-radius:5px}</style></head><body><div class="hero"><div class="wrap"><h1>上海人工智能训练师三级｜120分钟实操模拟</h1><p>按官方六道任务结构训练：业务分析、智能训练、智能系统设计、培训与指导</p></div></div><main class="wrap"><div class="card"><div class="timer" id="timer">120:00</div><button class="btn" onclick="startTimer()">开始计时</button><button class="btn" onclick="finish()">提交模拟</button><p class="muted">建议严格按考试节奏完成，并检查所有交付文件。</p></div><div id="tasks"></div><div class="card" id="result"></div></main><script>const tasks=[{t:'任务1｜业务流程设计（25分 / 30分钟）',d:'给定业务CSV，使用Python Notebook完成读取、统计、分组分析，并形成业务流程说明。',c:['正确读取CSV并显示样例','完成关键统计与分组','输出至少1张结果截图','形成流程设计说明','文件命名规范']},{t:'任务2｜业务模块效果优化（25分 / 30分钟）',d:'根据用户反馈或业务指标，识别3个核心问题，解释原因，并提出对应优化方案。',c:['识别问题','解释业务影响','提出实施步骤','描述预期效果','回答结构完整']},{t:'任务3｜数据处理规范制定（15分 / 20分钟）',d:'使用Python处理缺失、异常、重复、标准化、特征选择，并输出cleaned CSV与规范说明。',c:['缺失处理','异常处理','重复处理','标准化','特征/标签定义','输出CSV']},{t:'任务4｜算法测试（20分 / 20分钟）',d:'完成train/test划分、模型训练、预测、指标评价、模型保存和结果分析。',c:['数据划分','模型初始化与fit','predict','指标计算','保存模型','测试报告']},{t:'任务5｜智能系统监控和优化（15分 / 20分钟）',d:'根据日志、指标或模型结果定位问题，并提出性能、稳定性或数据层优化方案。',c:['识别异常','分析原因','提出优化','给出验证指标']},{t:'任务6｜人机交互/培训指导（20分 / 20分钟）',d:'设计人机交互流程，或围绕系统操作编写简明培训/指导内容。',c:['流程清晰','异常分支','用户体验','培训结构','注意事项']}];let html='';tasks.forEach((x,i)=>{html+=`<section class="card"><h2>${x.t}</h2><div class="task">${x.d}</div>${x.c.map((z,j)=>`<label class="check"><input type="checkbox" id="c${i}_${j}">${z}</label>`).join('')}<textarea id="n${i}" placeholder="记录你的答题思路、代码步骤或结果说明"></textarea></section>`});document.getElementById('tasks').innerHTML=html;let sec=7200,intv=null;function startTimer(){if(intv)return;intv=setInterval(()=>{sec--;let m=Math.floor(sec/60),s=sec%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(sec<=0){clearInterval(intv);finish()}},1000)}function finish(){let total=0,done=0;tasks.forEach((x,i)=>x.c.forEach((_,j)=>{total++;if(document.getElementById(`c${i}_${j}`).checked)done++}));let pct=Math.round(done/total*100);localStorage.setItem('practiceMockScore',pct);document.getElementById('result').innerHTML=`<h2>自检完成度：${pct}%</h2><p>${pct>=80?'完成度较好，下一步重点压缩操作时间并减少文件命名失误。':'建议重新训练未勾选的评分点，尤其是编码输出和测试报告。'}</p>`}</script></body></html>
