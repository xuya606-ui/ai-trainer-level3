<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三级学习成绩中心</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#1d4ed8,#315efb);color:#fff;padding:30px 18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.c4{grid-column:span 4}.c12{grid-column:span 12}.metric{font-size:32px;font-weight:800}.btn{background:#315efb;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.muted{color:#667085}@media(max-width:700px){.c4,.c12{grid-column:span 12}}</style></head><body><div class="hero"><div class="wrap"><h1>学习成绩中心</h1><p>汇总理论模拟、实操模拟和学习进度（保存在当前浏览器）</p></div></div><main class="wrap"><div class="grid"><section class="card c4"><div class="muted">理论模拟最近成绩</div><div class="metric" id="theory">--</div></section><section class="card c4"><div class="muted">实操模拟完成度</div><div class="metric" id="practice">--</div></section><section class="card c4"><div class="muted">建议状态</div><div class="metric" id="status">待测</div></section><section class="card c12"><h2>备考判断</h2><div id="advice"></div><button class="btn" onclick="clearAll()">清空本地成绩</button></section></div></main><script>let t=localStorage.getItem('mockExamScore');let p=localStorage.getItem('practiceMockScore');document.getElementById('theory').textContent=t===null?'未考试':t+'分';document.getElementById('practice').textContent=p===null?'未模拟':p+'%';let ts=t===null?null:+t,ps=p===null?null:+p;let status='待测',ad='先完成一次90分钟理论模拟和一次120分钟实操模拟。';if(ts!==null&&ps!==null){if(ts>=75&&ps>=80){status='较稳';ad='当前基础较好。建议重点做错题复盘、文件输出检查和限时实操。'}else if(ts>=60&&ps>=65){status='可冲刺';ad='已达到基本合格水平，但稳定性不足。优先补弱项模块并至少再做2次全真模拟。'}else{status='需加强';ad='目前不建议只刷题。先回到官方题型训练和编码模板库，把Python数据处理与模型测试练熟。'}}document.getElementById('status').textContent=status;document.getElementById('advice').textContent=ad;function clearAll(){['mockExamScore','practiceMockScore'].forEach(k=>localStorage.removeItem(k));location.reload()}</script></body></html>
